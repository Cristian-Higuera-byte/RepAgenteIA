<!-- [grafico] Ventana para comparar con otros símbolos -->
<!-- Fondo oscuro de la ventana de comparar (JS 35_comparar_simbolos.js; css/70_comparar.css). -->
<div id="cmp-modal-overlay" style="display:none;">
    <div id="cmp-modal-box">
        <div class="cmp-cab">
            <span class="cmp-titulo">Comparar o añadir símbolo</span>
            <button id="cmp-modal-close" title="Cerrar">✕</button>
        </div>
        <!-- Campo para escribir un símbolo; con Enter se agrega. -->
        <div class="cmp-buscar">
            <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="#8b949e" stroke-width="2"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
            <input type="text" id="cmp-search-input" placeholder="Símbolo (ej. GOLD, BTCUSD, US100Cash) · Enter para añadir" autocomplete="off" spellcheck="false">
        </div>
        <!-- Mensaje de error o aviso. -->
        <div id="cmp-msg"></div>
        <!-- Lista de símbolos sugeridos (la genera el JS). -->
        <div id="cmp-list-container"></div>
        <!-- Nota informativa al pie. -->
        <div class="cmp-pie">Las series se muestran en % de variación desde la primera barra visible. Máximo 5 símbolos.</div>
    </div>
</div>

<!-- [grafico] Ventana de ajustes de un indicador (entradas, estilo, visibilidad por temporalidad) -->
<!-- Fondo oscuro de la ventana de ajustes de un indicador (JS 32_indicadores_modal.js). -->
<div id="indcfg-overlay" style="display:none;">
    <div id="indcfg-box">
        <!-- Cabecera con el nombre del indicador y botón de cerrar. -->
        <div class="ind-cab">
            <span class="ind-titulo" id="indcfg-titulo">Ajustes</span>
            <button id="indcfg-close" title="Cerrar">✕</button>
        </div>
        <!-- Pestañas Entradas, Estilo y Visibilidad (las genera el JS). -->
        <div id="indcfg-tabs"></div>
        <!-- Cuerpo donde el JS dibuja los controles de la pestaña activa. -->
        <div id="indcfg-cuerpo"></div>
        <!-- Pie con Restablecer a la izquierda y Cancelar y Aceptar a la derecha. -->
        <div class="indcfg-pie">
            <button id="indcfg-reset" class="indcfg-btn" title="Vuelve a los valores por defecto del indicador">Restablecer</button>
            <span class="indcfg-espacio"></span>
            <button id="indcfg-cancel" class="indcfg-btn">Cancelar</button>
            <button id="indcfg-ok" class="indcfg-btn indcfg-primario">Aceptar</button>
        </div>
    </div>
</div>

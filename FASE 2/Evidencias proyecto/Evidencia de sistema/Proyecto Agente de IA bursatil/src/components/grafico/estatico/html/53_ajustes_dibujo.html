<!-- [grafico] Ventana de ajustes de un dibujo (estilo, texto, coordenadas, visibilidad por temporalidad) -->
<!-- Fondo oscuro de la ventana de ajustes de un dibujo (JS 29_dibujo_ajustes_herramienta.js; css/56_ajustes_dibujo.css). -->
<div id="dibcfg-overlay" style="display:none;">
    <div id="dibcfg-box">
        <!-- Cabecera con título y botón de cerrar. -->
        <div class="ind-cab">
            <span class="ind-titulo" id="dibcfg-titulo">Ajustes</span>
            <button id="dibcfg-close" title="Cerrar">✕</button>
        </div>
        <!-- Pestañas de la ventana (las genera el JS). -->
        <div id="dibcfg-tabs"></div>
        <!-- Cuerpo con los controles de estilo, texto, coordenadas y visibilidad. -->
        <div id="dibcfg-cuerpo"></div>
        <!-- Pie con los botones de restablecer, cancelar y aceptar (reutiliza las clases de la ventana de indicadores). -->
        <div class="indcfg-pie">
            <button id="dibcfg-reset" class="indcfg-btn" title="Vuelve al estilo por defecto de la herramienta">Restablecer</button>
            <span class="indcfg-espacio"></span>
            <button id="dibcfg-cancel" class="indcfg-btn">Cancelar</button>
            <button id="dibcfg-ok" class="indcfg-btn indcfg-primario">Aceptar</button>
        </div>
    </div>
</div>

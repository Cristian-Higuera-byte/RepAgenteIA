<!-- [grafico] Ventana de backtest: estrategia a la izquierda, resultados a la derecha -->
<!-- Fondo oscuro de la ventana de backtest (JS 60_backtest_motor.js y 61_backtest_ui.js; css/65_backtest.css). -->
<div id="backtest-superposicion" style="display:none;">
    <div id="backtest-caja">
        <div class="indicador-cabecera">
            <span class="indicador-titulo">Backtest de estrategias <span id="backtest-subtitulo"></span></span>
            <button id="backtest-cerrar" title="Cerrar">✕</button>
        </div>
        <!-- Área principal con dos columnas. -->
        <div id="backtest-principal">
            <!-- Formulario de la estrategia (lo construye el JS). -->
            <div id="backtest-formulario"></div>
            <!-- Zona de resultados; muestra un mensaje hasta que se ejecuta el backtest. -->
            <div id="backtest-resultado"><div class="backtest-vacio">Define la estrategia y pulsa <b>Ejecutar backtest</b>.</div></div>
        </div>
    </div>
</div>

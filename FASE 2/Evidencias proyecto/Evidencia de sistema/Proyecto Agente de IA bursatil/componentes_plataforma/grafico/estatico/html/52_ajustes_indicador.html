<!-- [grafico] Ventana de ajustes de un indicador (entradas, estilo, visibilidad por temporalidad) -->
<!-- Fondo oscuro de la ventana de ajustes de un indicador (JS 32_indicadores_modal.js). -->
<div id="indicadores-configuracion-superposicion" style="display:none;">
    <div id="indicadores-configuracion-caja">
        <!-- Cabecera con el nombre del indicador y botón de cerrar. -->
        <div class="indicador-cabecera">
            <span class="indicador-titulo" id="indicadores-configuracion-titulo">Ajustes</span>
            <button id="indicadores-configuracion-cerrar" title="Cerrar">✕</button>
        </div>
        <!-- Pestañas Entradas, Estilo y Visibilidad (las genera el JS). -->
        <div id="indicadores-configuracion-pestanas"></div>
        <!-- Cuerpo donde el JS dibuja los controles de la pestaña activa. -->
        <div id="indicadores-configuracion-cuerpo"></div>
        <!-- Pie con Restablecer a la izquierda y Cancelar y Aceptar a la derecha. -->
        <div class="indicadores-configuracion-pie">
            <button id="indicadores-configuracion-reiniciar" class="indicadores-configuracion-boton" title="Vuelve a los valores por defecto del indicador">Restablecer</button>
            <span class="indicadores-configuracion-espacio"></span>
            <button id="indicadores-configuracion-cancelar" class="indicadores-configuracion-boton">Cancelar</button>
            <button id="indicadores-configuracion-aceptar" class="indicadores-configuracion-boton indicadores-configuracion-primario">Aceptar</button>
        </div>
    </div>
</div>

<!-- [grafico] Ventana de ajustes de un dibujo (estilo, texto, coordenadas, visibilidad por temporalidad) -->
<!-- Fondo oscuro de la ventana de ajustes de un dibujo (JS 29_dibujo_ajustes_herramienta.js; css/56_ajustes_dibujo.css). -->
<div id="dibujo-configuracion-superposicion" style="display:none;">
    <div id="dibujo-configuracion-caja">
        <!-- Cabecera con título y botón de cerrar. -->
        <div class="indicador-cabecera">
            <span class="indicador-titulo" id="dibujo-configuracion-titulo">Ajustes</span>
            <button id="dibujo-configuracion-cerrar" title="Cerrar">✕</button>
        </div>
        <!-- Pestañas de la ventana (las genera el JS). -->
        <div id="dibujo-configuracion-pestanas"></div>
        <!-- Cuerpo con los controles de estilo, texto, coordenadas y visibilidad. -->
        <div id="dibujo-configuracion-cuerpo"></div>
        <!-- Pie con los botones de restablecer, cancelar y aceptar (reutiliza las clases de la ventana de indicadores). -->
        <div class="indicadores-configuracion-pie">
            <button id="dibujo-configuracion-reiniciar" class="indicadores-configuracion-boton" title="Vuelve al estilo por defecto de la herramienta">Restablecer</button>
            <span class="indicadores-configuracion-espacio"></span>
            <button id="dibujo-configuracion-cancelar" class="indicadores-configuracion-boton">Cancelar</button>
            <button id="dibujo-configuracion-aceptar" class="indicadores-configuracion-boton indicadores-configuracion-primario">Aceptar</button>
        </div>
    </div>
</div>

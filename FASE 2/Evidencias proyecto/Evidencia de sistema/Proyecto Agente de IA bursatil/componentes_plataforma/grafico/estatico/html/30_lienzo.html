<!-- [grafico] Lienzo, leyenda OHLC y capa de dibujo -->
            <!-- Contenedor del lienzo (css/40_lienzo.css). El JS le agrega las clases modo-* y cur-* según el cursor. -->
            <div id="grafico-contenedor">
                <!-- Elemento donde Lightweight Charts monta el gráfico (10_grafico_base.js). -->
                <div id="c"></div>
                <!-- Capa transparente donde se pintan los dibujos del usuario (21_dibujo_hit_y_render.js). -->
                <canvas id="dibujo-lienzo"></canvas>
                <!-- Leyenda flotante sobre el gráfico; los valores los actualiza 40_datos_y_leyenda.js. -->
                <div id="tradingview-leyenda">
                    <div class="leyenda-linea">
                        <!-- Símbolo (el ensamblador sustituye el marcador de la línea siguiente por el nombre real), temporalidad (#leyenda-temporalidad) y fuente de datos; en pantalla completa el símbolo abre el selector de activo. -->
                        <span class="leyenda-simbolo" id="leyenda-simbolo" title="Cambiar de activo (pantalla completa)">__SIMBOLO_HTML__</span><span class="leyenda-dot">·</span><span class="leyenda-temporalidad" id="leyenda-temporalidad">H1</span><span class="leyenda-dot">·</span><span class="leyenda-flujo">XM</span>
                        <!-- Valores OHLC de la vela bajo el cursor. -->
                        <span class="tradingview-ohlc" id="tradingview-ohlc-valores">Cargando…</span>
                    </div>
                    <!-- Línea con el volumen de la vela. -->
                    <div class="leyenda-linea"><span class="tradingview-volumen" id="tradingview-volumen-valor"></span></div>
                    <!-- Leyenda de símbolos comparados (la llena 35_comparar_simbolos.js). -->
                    <div id="tradingview-comparar-leyenda"></div>
                    <!-- Leyenda de indicadores activos (la llena 31_indicadores_paneles.js). -->
                    <div id="tradingview-indicador-leyenda"></div>
                </div>

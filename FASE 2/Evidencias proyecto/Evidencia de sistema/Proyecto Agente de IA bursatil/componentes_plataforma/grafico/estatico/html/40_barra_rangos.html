<!-- [grafico] Barra inferior de rangos -->
    <!-- Barra inferior de rangos (css/60_barra_rangos.css). Cada botón .tvrange aplica una temporalidad (data-tf) y una cantidad de velas (data-n) que corresponden a un rango de tiempo. -->
    <div id="tradingview-rangebar">
        <span class="tradingview-rangelabel">Rango</span>
        <!-- Rango 1 día en velas de 5 minutos. -->
        <button class="tvrange" data-tf="M5" data-n="288">1D</button>
        <button class="tvrange" data-tf="M15" data-n="480">5D</button>
        <button class="tvrange" data-tf="H1" data-n="528">1 mes</button>
        <button class="tvrange" data-tf="H4" data-n="400">3 meses</button>
        <button class="tvrange" data-tf="D1" data-n="132">6 meses</button>
        <button class="tvrange" data-tf="D1" data-n="252">1 año</button>
        <button class="tvrange" data-tf="W1" data-n="260">5 años</button>
        <!-- Todo el historial disponible en velas semanales. -->
        <button class="tvrange" data-tf="W1" data-n="2000">Todo</button>
        <!-- Solo en pantallas tactiles (clase pj-tactil en html, ver 55_pantalla_completa.js): amplia el grafico a toda la pantalla y muestra sus herramientas de dibujo, como XM. Queda fijo a la derecha de la barra. -->
        <button class="tvbtn icon" id="boton-expandir-movil" title="Ampliar gráfico" aria-label="Ampliar gráfico">
            <svg class="ic-expandir" viewBox="0 0 20 20"><path d="M3 7.5V3h4.5M12.5 3H17v4.5M17 12.5V17h-4.5M7.5 17H3v-4.5"/></svg>
            <svg class="ic-contraer" viewBox="0 0 20 20"><path d="M7.5 3v4.5H3M12.5 3v4.5H17M17 12.5h-4.5V17M3 12.5h4.5V17"/></svg>
        </button>
